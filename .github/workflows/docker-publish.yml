name: Docker

on:
  push:
    branches:
      - main

env:
  VERSION: "26.04"
  UBUNTU_IMAGE: "axiphi/oakestra-vm-ubuntu"
  MESA_IMAGE: "axiphi/oakestra-vm-mesa"
  WOLF_IMAGE: "axiphi/oakestra-vm-wolf"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Import multi-architecture Ubuntu cloud image
        working-directory: ./oakestra-vm-ubuntu
        run: ./import-raw.sh docker "${VERSION}" linux/amd64 linux/arm64/v8

      - name: Build multi-architecture Ubuntu VM base image
        working-directory: ./oakestra-vm-ubuntu
        run: |
          docker build \
            --platform linux/amd64,linux/arm64/v8 \
            --load \
            --tag "${UBUNTU_IMAGE}:${VERSION}" \
            --build-arg "VERSION=${VERSION}" \
            .

      - name: Build multi-architecture Mesa image
        working-directory: ./oakestra-vm-mesa
        run: |
          docker build \
            --platform linux/amd64,linux/arm64/v8 \
            --load \
            --tag "${MESA_IMAGE}:${VERSION}" \
            --build-arg "VERSION=${VERSION}" \
            .

      - name: Build multi-architecture Wolf image
        working-directory: ./oakestra-vm-wolf
        run: |
          docker build \
            --platform linux/amd64,linux/arm64/v8 \
            --load \
            --tag "${WOLF_IMAGE}:${VERSION}" \
            --build-arg "VERSION=${VERSION}" \
            .

      - name: Push multi-architecture images
        run: |
          docker push "${MESA_IMAGE}:${VERSION}"
          docker push "${WOLF_IMAGE}:${VERSION}"
